<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Memo Web</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 420px;
      margin: 70px auto;
      padding: 30px;
      background: #1b1b1b;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .login-btn {
      background: #32c766;
      color: white;
    }

    .google-btn {
      background: white;
      color: #222;
      border: 1px solid #ccc;
    }

    .github-btn {
      background: #24292f;
      color: white;
    }

    .signup-link {
      text-align: center;
      margin-top: 20px;
    }

    a {
      color: #32c766;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      color: #ff7777;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>Login</h1>

    <input
      id="email"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      id="loginBtn"
      class="login-btn"
    >
      Login
    </button>

    <button
      id="googleBtn"
      class="google-btn"
    >
      Continue with Google
    </button>

    <button
      id="githubBtn"
      class="github-btn"
    >
      Continue with GitHub
    </button>

    <p id="message"></p>

    <div class="signup-link">

      Don't have an account?
      <a href="signup.html">Sign Up</a>

    </div>

  </div>

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      GoogleAuthProvider,
      GithubAuthProvider,
      signInWithPopup,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

    import {
      firebaseConfig
    } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);

    const message = document.getElementById("message");

    async function saveProfile(user) {

      const realName = prompt("Enter your real name:");

      if (!realName) {
        return;
      }

      const nickname = prompt("Enter your nickname:");

      if (!nickname) {
        return;
      }

      await updateProfile(user, {
        displayName: nickname
      });

      await setDoc(
        doc(db, "users", user.uid),
        {
          realName: realName,
          nickname: nickname,
          email: user.email || "",
          updatedAt: serverTimestamp()
        },
        {
          merge: true
        }
      );

    }

    document
      .getElementById("loginBtn")
      .addEventListener("click", async () => {

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        if (!email || !password) {

          message.textContent =
            "Please enter your email and password.";

          return;
        }

        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

          window.location.href = "index.html";

        } catch (error) {

          message.textContent = error.message;

        }

      });

    document
      .getElementById("googleBtn")
      .addEventListener("click", async () => {

        try {

          const provider =
            new GoogleAuthProvider();

          const result =
            await signInWithPopup(auth, provider);

          await saveProfile(result.user);

          window.location.href = "index.html";

        } catch (error) {

          message.textContent = error.message;

        }

      });

    document
      .getElementById("githubBtn")
      .addEventListener("click", async () => {

        try {

          const provider =
            new GithubAuthProvider();

          const result =
            await signInWithPopup(auth, provider);

          await saveProfile(result.user);

          window.location.href = "index.html";

        } catch (error) {

          message.textContent = error.message;

        }

      });

  </script>

</body>

</html>
