<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Memo Web</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    font-family: "Courier New", monospace;

    background:
      linear-gradient(
        45deg,
        #0b0b0b 25%,
        #111 25%,
        #111 50%,
        #0b0b0b 50%,
        #0b0b0b 75%,
        #111 75%
      );

    background-size: 16px 16px;

    color: white;
  }

  .container {
    width: 90%;
    max-width: 420px;

    padding: 30px;

    background: #181818;

    border: 4px solid #32c766;

    box-shadow:
      8px 8px 0 #000,
      0 0 0 4px #0a0a0a;

    border-radius: 0;
  }

  h1 {
    text-align: center;

    margin-top: 0;
    margin-bottom: 25px;

    font-size: 30px;

    color: #32c766;

    text-shadow:
      3px 3px 0 #000;
  }

  input {
    width: 100%;

    padding: 13px;

    margin: 8px 0;

    font-family: "Courier New", monospace;
    font-size: 16px;

    color: white;
    background: #0d0d0d;

    border: 3px solid #555;

    border-radius: 0;

    outline: none;

    box-shadow:
      4px 4px 0 #000;
  }

  input:focus {
    border-color: #32c766;

    box-shadow:
      4px 4px 0 #32c766;
  }

  button {
    width: 100%;

    padding: 13px;

    margin-top: 12px;

    font-family: "Courier New", monospace;
    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    border: 3px solid #000;

    border-radius: 0;

    transition:
      transform 0.08s,
      box-shadow 0.08s;
  }

  /* تأثير Pixel عند الضغط */
  button:active {
    transform: translate(4px, 4px);

    box-shadow: none !important;
  }

  /* LOGIN / SIGN UP */

  .login-btn,
  .signup-btn {
    background: #32c766;
    color: #000;

    box-shadow:
      5px 5px 0 #146b35;
  }

  .login-btn:hover,
  .signup-btn:hover {
    background: #45e078;
  }

  /* GOOGLE */

  .google-btn {
    background: #fff;
    color: #222;

    border-color: #000;

    box-shadow:
      5px 5px 0 #999;
  }

  .google-btn:hover {
    background: #e9e9e9;
  }

  /* GITHUB */

  .github-btn {
    background: #24292f;
    color: white;

    box-shadow:
      5px 5px 0 #000;
  }

  .github-btn:hover {
    background: #343a40;
  }

  .signup-link,
  .login-link {
    text-align: center;

    margin-top: 22px;

    font-size: 14px;
  }

  a {
    color: #32c766;

    font-weight: bold;

    text-decoration: none;
  }

  a:hover {
    color: #65ef8d;

    text-decoration: underline;
  }

  #message {
    text-align: center;

    margin-top: 16px;

    color: #ff7777;

    font-weight: bold;
  }

  /* للموبايل */

  @media (max-width: 500px) {
    .container {
      width: 88%;

      padding: 22px;
    }

    h1 {
      font-size: 25px;
    }

    button,
    input {
      font-size: 14px;
    }
  }
</style>

</head>

<body>

  <div class="container">

    <h1>Login</h1>

    <input
      id="email"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      id="loginBtn"
      class="login-btn"
    >
      Login
    </button>

    <button
      id="googleBtn"
      class="google-btn"
    >
      Continue with Google
    </button>

    <button
      id="githubBtn"
      class="github-btn"
    >
      Continue with GitHub
    </button>

    <p id="message"></p>

    <div class="signup-link">

      Don't have an account?
      <a href="signup.html">Sign Up</a>

    </div>

  </div>

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      GoogleAuthProvider,
      GithubAuthProvider,
      signInWithPopup,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

    import {
      firebaseConfig
    } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);

    const message = document.getElementById("message");

    async function saveProfile(user) {

      const realName = prompt("Enter your real name:");

      if (!realName) {
        return;
      }

      const nickname = prompt("Enter your nickname:");

      if (!nickname) {
        return;
      }

      await updateProfile(user, {
        displayName: nickname
      });

      await setDoc(
        doc(db, "users", user.uid),
        {
          realName: realName,
          nickname: nickname,
          email: user.email || "",
          updatedAt: serverTimestamp()
        },
        {
          merge: true
        }
      );

    }

    document
      .getElementById("loginBtn")
      .addEventListener("click", async () => {

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        if (!email || !password) {

          message.textContent =
            "Please enter your email and password.";

          return;
        }

        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

          window.location.href = "index.html";

        } catch (error) {

          message.textContent = error.message;

        }

      });

    document
      .getElementById("googleBtn")
      .addEventListener("click", async () => {

        try {

          const provider =
            new GoogleAuthProvider();

          const result =
            await signInWithPopup(auth, provider);

          await saveProfile(result.user);

          window.location.href = "index.html";

        } catch (error) {

          message.textContent = error.message;

        }

      });

    document
      .getElementById("githubBtn")
      .addEventListener("click", async () => {

        try {

          const provider =
            new GithubAuthProvider();

          const result =
            await signInWithPopup(auth, provider);

          await saveProfile(result.user);

          window.location.href = "index.html";

        } catch (error) {

          message.textContent = error.message;

        }

      });

  </script>

</body>

</html>
