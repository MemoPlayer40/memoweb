<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Memo Player</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-box">
    <h1>Login</h1>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Email" autocomplete="email" required>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Login</button>
    </form>

    <div class="social-login">
      <p>Or login with</p>
      <button id="googleBtn" type="button">Continue with Google</button>
      <button id="githubBtn" type="button">Continue with GitHub</button>
    </div>

    <p id="message"></p>
    <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
    <p><a href="index.html">Back to Memo Web</a></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      GoogleAuthProvider,
      GithubAuthProvider,
      signInWithPopup,
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
    import { firebaseConfig } from "./firebase-config.js";
    import { saveProfile } from "./profile.js";

    const auth = getAuth(initializeApp(firebaseConfig));
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "Logging in...";
      try {
        await signInWithEmailAndPassword(auth, email.value, password.value);
        window.location.href = "index.html";
      } catch (error) {
        message.textContent = error.message;
      }
    });

    async function socialLogin(provider) {
      message.textContent = "Connecting...";
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        const realName = prompt("Enter your real name:");
        if (!realName || !realName.trim()) {
          await auth.signOut();
          message.textContent = "Real name is required.";
          return;
        }
        const nickname = prompt("Enter your nickname:") || user.displayName || "";
        if (!nickname.trim()) {
          await auth.signOut();
          message.textContent = "Nickname is required.";
          return;
        }
        await saveProfile(user, realName.trim(), nickname.trim());
        window.location.href = "index.html";
      } catch (error) {
        message.textContent = error.message;
      }
    }



        await saveProfile(user, realName.trim(), nickname.trim());
        window.location.href = "index.html";
      } catch (error) {
        message.textContent = error.message;
      }
    });

    document.getElementById("googleBtn").addEventListener("click", () => socialLogin(new GoogleAuthProvider()));
    document.getElementById("githubBtn").addEventListener("click", () => socialLogin(new GithubAuthProvider()));
  </script>
</body>
</html>
