<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign Up - Memo Web</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    font-family: "Courier New", monospace;

    background:
      linear-gradient(
        45deg,
        #0b0b0b 25%,
        #111 25%,
        #111 50%,
        #0b0b0b 50%,
        #0b0b0b 75%,
        #111 75%
      );

    background-size: 16px 16px;

    color: white;
  }

  .container {
    width: 90%;
    max-width: 420px;

    padding: 30px;

    background: #181818;

    border: 4px solid #32c766;

    box-shadow:
      8px 8px 0 #000,
      0 0 0 4px #0a0a0a;

    border-radius: 0;
  }

  h1 {
    text-align: center;

    margin-top: 0;
    margin-bottom: 25px;

    font-size: 30px;

    color: #32c766;

    text-shadow:
      3px 3px 0 #000;
  }

  input {
    width: 100%;

    padding: 13px;

    margin: 8px 0;

    font-family: "Courier New", monospace;
    font-size: 16px;

    color: white;
    background: #0d0d0d;

    border: 3px solid #555;

    border-radius: 0;

    outline: none;

    box-shadow:
      4px 4px 0 #000;
  }

  input:focus {
    border-color: #32c766;

    box-shadow:
      4px 4px 0 #32c766;
  }

  button {
    width: 100%;

    padding: 13px;

    margin-top: 12px;

    font-family: "Courier New", monospace;
    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    border: 3px solid #000;

    border-radius: 0;

    transition:
      transform 0.08s,
      box-shadow 0.08s;
  }

  /* تأثير Pixel عند الضغط */
  button:active {
    transform: translate(4px, 4px);

    box-shadow: none !important;
  }

  /* LOGIN / SIGN UP */

  .login-btn,
  .signup-btn {
    background: #32c766;
    color: #000;

    box-shadow:
      5px 5px 0 #146b35;
  }

  .login-btn:hover,
  .signup-btn:hover {
    background: #45e078;
  }

  /* GOOGLE */

  .google-btn {
    background: #fff;
    color: #222;

    border-color: #000;

    box-shadow:
      5px 5px 0 #999;
  }

  .google-btn:hover {
    background: #e9e9e9;
  }

  /* GITHUB */

  .github-btn {
    background: #24292f;
    color: white;

    box-shadow:
      5px 5px 0 #000;
  }

  .github-btn:hover {
    background: #343a40;
  }

  .signup-link,
  .login-link {
    text-align: center;

    margin-top: 22px;

    font-size: 14px;
  }

  a {
    color: #32c766;

    font-weight: bold;

    text-decoration: none;
  }

  a:hover {
    color: #65ef8d;

    text-decoration: underline;
  }

  #message {
    text-align: center;

    margin-top: 16px;

    color: #ff7777;

    font-weight: bold;
  }

  /* للموبايل */

  @media (max-width: 500px) {
    .container {
      width: 88%;

      padding: 22px;
    }

    h1 {
      font-size: 25px;
    }

    button,
    input {
      font-size: 14px;
    }
  }
</style>

</head>

<body>

  <div class="container">

    <h1>Create Account</h1>

    <input
      id="realName"
      type="text"
      placeholder="Real Name"
      autocomplete="name"
    >

    <input
      id="nickname"
      type="text"
      placeholder="Nickname"
      autocomplete="nickname"
    >

    <input
      id="email"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="new-password"
    >

    <button
      id="signupBtn"
      class="signup-btn"
    >
      Sign Up
    </button>

    <button
      id="googleBtn"
      class="google-btn"
    >
      Continue with Google
    </button>

    <button
      id="githubBtn"
      class="github-btn"
    >
      Continue with GitHub
    </button>

    <p id="message"></p>

    <div class="login-link">

      Already have an account?
      <a href="login.html">Login</a>

    </div>

  </div>

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      GoogleAuthProvider,
      GithubAuthProvider,
      signInWithPopup,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

    import {
      firebaseConfig
    } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);

    const message =
      document.getElementById("message");

    async function saveProfile(
      user,
      realName,
      nickname
    ) {

      await updateProfile(user, {
        displayName: nickname
      });

      await setDoc(
        doc(db, "users", user.uid),
        {
          realName: realName,
          nickname: nickname,
          email: user.email || "",
          updatedAt: serverTimestamp()
        },
        {
          merge: true
        }
      );

    }

    document
      .getElementById("signupBtn")
      .addEventListener("click", async () => {

        const realName =
          document.getElementById("realName")
            .value.trim();

        const nickname =
          document.getElementById("nickname")
            .value.trim();

        const email =
          document.getElementById("email")
            .value.trim();

        const password =
          document.getElementById("password")
            .value;

        if (
          !realName ||
          !nickname ||
          !email ||
          !password
        ) {

          message.textContent =
            "Please fill in all fields.";

          return;
        }

        if (password.length < 6) {

          message.textContent =
            "Password must be at least 6 characters.";

          return;
        }

        try {

          const result =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );

          await saveProfile(
            result.user,
            realName,
            nickname
          );

          window.location.href = "index.html";

        } catch (error) {

          message.textContent =
            error.message;

        }

      });

    async function socialSignup(provider) {

      try {

        const result =
          await signInWithPopup(
            auth,
            provider
          );

        const realName =
          prompt("Enter your real name:");

        if (!realName) {
          return;
        }

        const nickname =
          prompt("Enter your nickname:");

        if (!nickname) {
          return;
        }

        await saveProfile(
          result.user,
          realName,
          nickname
        );

        window.location.href =
          "index.html";

      } catch (error) {

        message.textContent =
          error.message;

      }

    }

    document
      .getElementById("googleBtn")
      .addEventListener("click", () => {

        const provider =
          new GoogleAuthProvider();

        socialSignup(provider);

      });

    document
      .getElementById("githubBtn")
      .addEventListener("click", () => {

        const provider =
          new GithubAuthProvider();

        socialSignup(provider);

      });

  </script>

</body>

</html>
